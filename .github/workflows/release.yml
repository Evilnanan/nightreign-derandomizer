name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      DIST: build/dist
    steps:
      - name: Resolve release tag
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Could not determine the release tag.'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-+].*)?$') {
            throw "Tag '$tag' is not a semantic version tag (expected vX.Y.Z or vX.Y.Z-suffix)."
          }
          $version = $tag -replace '^v', ''
          $isPrerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved tag=$tag version=$version prerelease=$isPrerelease"

      - name: Checkout the tagged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -format value -property installationPath
          }

      - name: Configure
        run: cmake --preset vs2026-x64

      - name: Build (Release)
        run: cmake --build --preset release

      - name: Verify expected artifacts exist
        shell: pwsh
        run: |
          $dist = Join-Path $env:DIST 'Release'
          if (-not (Test-Path $dist)) { throw "Build output directory not found: $dist" }
          foreach ($name in @('derandomizer.dll', 'Seed Reroller.exe')) {
            $path = Join-Path $dist $name
            if (-not (Test-Path $path)) { throw "Missing expected artifact: $path" }
            Write-Host ("{0}  {1:N0} bytes" -f $name, (Get-Item $path).Length)
          }

      - name: Package distribution zip
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $stage = 'stage/nightreign-derandomizer'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $env:DIST 'Release/derandomizer.dll') $stage
          Copy-Item (Join-Path $env:DIST 'Release/Seed Reroller.exe') $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'README.zh-CN.md' $stage
          $zip = "nightreign-derandomizer-$env:VERSION-win64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host ("Packaged {0}  {1:N0} bytes" -f $zip, (Get-Item $zip).Length)

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            Write-Host "::warning::Release $env:TAG already exists; refreshing the asset only."
            gh release upload $env:TAG $env:ZIP --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload asset to $env:TAG." }
            if ($env:PRERELEASE -eq 'true') {
              gh release edit $env:TAG --prerelease
              if ($LASTEXITCODE -ne 0) { throw "Failed to mark $env:TAG as a prerelease." }
            }
          }
          else {
            $ghArgs = @(
              'release', 'create', $env:TAG, $env:ZIP,
              '--title', "v$env:VERSION",
              '--generate-notes',
              '--verify-tag'
            )
            if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
            gh @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $env:TAG." }
          }

      - name: Write job summary
        if: always()
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          TRIGGER: ${{ github.event_name }}
        run: |
          $lines = @(
            "## Release $env:TAG"
            ""
            "- Asset: $env:ZIP"
            "- Trigger: $env:TRIGGER"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines
